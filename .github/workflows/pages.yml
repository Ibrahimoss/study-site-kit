# Builds the site and publishes it with GitHub Pages on every push to main.
# Turn it on once: repository Settings > Pages > Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # runs only in a course copy (the kit itself has no course.json)
    if: hashFiles('course.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r engine/requirements.txt
      # site/slides, site/audio and site/shorts are made on the person's computer and committed;
      # the build only regenerates index.html and the thumbnails from them
      - run: python -I engine/build.py --target github-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
