<title>__SITE_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: a unit rail of "blocks" on the left, a working pane on the right; lesson text held near 68ch.
   Palette: cool solder-mask paper, PCB-green ink, one copper accent for everything you can press. */
:root{
  --bg:#F1F4F1;
  --surface:#FFFFFF;
  --surface-2:#E6EBE6;
  --ink:#14211B;
  --ink-2:#4C5A53;
  --ink-3:#77857E;
  --line:#D2DAD4;
  --pcb:#18402F;
  --copper:#A4501C;
  --copper-ink:#FFFFFF;
  --copper-soft:#F4E3D7;
  --ok:#1D774A;
  --ok-soft:#DCEFE3;
  --bad:#B33030;
  --bad-soft:#F6DFDF;
  --tip:#7A5A0E;
  --tip-soft:#F6EDCF;
  --code-bg:#13231C;
  --code-fg:#DCE8E1;
  --code-dim:#7F9A8C;
  --code-kw:#F0A46E;
  --code-cu:#F2C14E;
  --code-bi:#8FD3B0;
  --code-api:#9CC4F0;
  --code-num:#E79A9A;
  --code-str:#C6D98A;
  --scrim:rgba(8,16,12,.86);
  --shadow:0 1px 2px rgba(20,33,27,.06),0 6px 18px rgba(20,33,27,.06);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1411;--surface:#121D18;--surface-2:#192822;--ink:#E2EBE6;--ink-2:#A2B1A9;--ink-3:#71827A;--line:#25362E;
  --pcb:#9FD3B9;--copper:#E58B52;--copper-ink:#1A0E06;--copper-soft:#3A2416;--ok:#57C892;--ok-soft:#123222;
  --bad:#F07A7A;--bad-soft:#3B1818;--tip:#E8C46A;--tip-soft:#33290F;--code-bg:#08100C;--scrim:rgba(0,0,0,.88);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1411;--surface:#121D18;--surface-2:#192822;--ink:#E2EBE6;--ink-2:#A2B1A9;--ink-3:#71827A;--line:#25362E;
  --pcb:#9FD3B9;--copper:#E58B52;--copper-ink:#1A0E06;--copper-soft:#3A2416;--ok:#57C892;--ok-soft:#123222;
  --bad:#F07A7A;--bad-soft:#3B1818;--tip:#E8C46A;--tip-soft:#33290F;--code-bg:#08100C;--scrim:rgba(0,0,0,.88);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:6px}
code,pre,.mono{font-family:var(--f-mono)}
:not(pre) > code{overflow-wrap:anywhere}
p,li,dd,dt,td,.txt{overflow-wrap:break-word}
.blocks,.quiz,.cards,.tut,.sres{grid-template-columns:minmax(0,1fr)}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1380px;margin:0 auto}

/* top bar */
/* the header scrolls away; the unit strip row below it (with the section stopwatch) is what stays pinned */
.top{position:static;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand .glyph{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand .glyph i{width:7px;height:7px;background:var(--pcb);border-radius:1px;opacity:.85}
.brand .glyph i:nth-child(5){background:var(--copper);opacity:1}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.brand small{display:block;font:12px/1.2 var(--f-mono);color:var(--ink-3);margin-top:2px}
.topnav{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.search{position:relative;min-width:0}
.search input{width:230px;max-width:100%;font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 12px 7px 32px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:var(--copper-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.on{background:var(--copper-soft);border-color:var(--copper);color:var(--ink)}
.actions .btn{white-space:normal;max-width:100%;text-align:left}

/* sticky nav row: the section stopwatch at its left end, the unit chips scrolling beside it */
.striprow{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--bg);border-bottom:1px solid var(--line);padding-block:7px}
body.shorts-on .striprow{display:none}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto}

/* shell */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;padding-top:20px;align-items:start}
.shell.full{grid-template-columns:minmax(0,1fr)}
.shell.full .rail{display:none}
.rail{scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,46px) + 12px);display:flex;flex-direction:column;gap:6px;
  max-height:calc(100vh - 100px);overflow-y:auto;padding-bottom:12px}
.rail h4{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:6px 4px 4px}
.ublock{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;
  border-radius:var(--r);padding:9px 10px;cursor:pointer;color:var(--ink)}
.ublock:hover{background:var(--surface);border-color:var(--line)}
.ublock.cur{background:var(--surface);border-color:var(--copper);box-shadow:var(--shadow)}
.ublock .code{font:800 19px/1 var(--f-display);color:var(--pcb);align-self:center;min-width:46px}
.ublock .t{font-size:14px;line-height:1.3;font-weight:700}


main{min-width:0}

/* home */
.hero{display:grid;gap:14px;padding-block:18px 26px;border-bottom:1px solid var(--line)}
.hero h1{font:800 clamp(44px,7vw,84px)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.hero p.lede{max-width:64ch;color:var(--ink-2);font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font:14px var(--f-mono);color:var(--ink-2)}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.resume{font-size:14px;color:var(--ink-2)}
.ugrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:24px}
@media (max-width:760px){.ugrid{grid-template-columns:minmax(0,1fr)}}
.ucard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.ucard .head{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.ucard .code{font:800 30px/1 var(--f-display);color:var(--pcb)}
.ucard .idx{font:12px var(--f-mono);color:var(--ink-3)}
.ucard h3{font-size:17px;line-height:1.3}
.ucard p{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ucard .meta{font:12px var(--f-mono);color:var(--ink-3);margin-top:auto}
.ucard .go{display:flex;flex-wrap:wrap;gap:6px}

/* unit header + tabs */
.uhead{display:grid;gap:10px;padding-bottom:4px}
.uhead .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.uhead .code{font:800 44px/1 var(--f-display);color:var(--pcb)}
.uhead h2{font:700 clamp(22px,3vw,30px)/1.15 var(--f-body)}
.uhead p{color:var(--ink-2);max-width:72ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,46px));background:var(--bg);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;font-size:15px;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;
  white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.cur{color:var(--ink);border-bottom-color:var(--copper);font-weight:700}
.tab .n{font:12px var(--f-mono);color:var(--ink-3);margin-left:4px}
.pane{padding-top:22px}

/* lesson */
.learn{display:grid;grid-template-columns:minmax(0,68ch) minmax(0,220px);gap:40px;justify-content:start}
@media (max-width:1100px){.learn{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.objectives{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.objectives h4,.toc h4{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.objectives ul{margin:0;padding-left:18px}
.lsec{padding-top:30px;scroll-margin-top:calc(var(--toph,62px) + 60px)}
.lsec h3{font-size:21px;line-height:1.25;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lsec h3 .num{font:600 13px var(--f-mono);color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font:12px/1 var(--f-mono);color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:5px 9px;cursor:pointer}
.chip:hover{border-color:var(--copper);color:var(--ink)}
.chip svg{width:12px;height:12px;stroke:currentColor}
.blocks{display:grid;gap:14px;margin-top:14px}
.blocks ul,.blocks ol{margin:0;padding-left:22px;display:grid;gap:4px}
.blocks code,.q code,.opt code,.explain code,.face code,.sres code{font-size:.9em;background:var(--surface-2);border-radius:4px;padding:.05em .3em}
pre.code code{font-size:inherit;background:none;border-radius:0;padding:0}
pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);padding:14px 16px;overflow-x:auto;
  font-size:13.5px;line-height:1.55;tab-size:4}
pre.code .c{color:var(--code-dim);font-style:italic}
pre.code .kw{color:var(--code-kw)}
pre.code .cu{color:var(--code-cu);font-weight:600}
pre.code .bi{color:var(--code-bi)}
pre.code .api{color:var(--code-api)}
pre.code .nm{color:var(--code-num)}
pre.code .st{color:var(--code-str)}
pre.code .pp{color:var(--code-kw)}
pre.code .ln{color:var(--code-cu);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:600 12px var(--f-mono);letter-spacing:.04em;color:var(--ink-2);background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
dl.defs{margin:0;display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:8px 16px}
dl.defs dt{font-weight:700}
dl.defs dd{margin:0;color:var(--ink-2)}
@media (max-width:560px){dl.defs{grid-template-columns:minmax(0,1fr)}dl.defs dd{margin-bottom:6px}}
.callout{border-radius:var(--r);padding:11px 14px;font-size:15px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.callout .lab{font:600 11px/1.9 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.callout.tip{background:var(--tip-soft)} .callout.tip .lab{color:var(--tip)}
.callout.note{background:var(--surface-2)} .callout.note .lab{color:var(--ink-2)}
figure.fig{margin:0;display:grid;gap:6px}
figure.fig > button{border:1px solid var(--line);border-radius:var(--r);padding:0;background:#fff;cursor:zoom-in;overflow:hidden;display:block;width:100%}
figure.fig img{display:block;width:100%;height:auto;max-height:min(620px,75vh);object-fit:contain;background:#fff}
figure.fig figcaption{font-size:13px;color:var(--ink-2)}
.toc{position:sticky;top:calc(var(--toph,62px) + 70px);align-self:start;font-size:13px;max-height:calc(100vh - 170px);overflow-y:auto}
.toc a{display:block;color:var(--ink-2);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid var(--line);line-height:1.35}
.toc a:hover{color:var(--ink);border-left-color:var(--copper)}

/* slides */
.viewer{display:grid;gap:12px}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vbar .sp{flex:1}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;justify-content:center;align-items:center}
.stage img{display:block;max-width:100%;height:auto;max-height:calc(100vh - 290px);width:auto;cursor:zoom-in;background:#fff}
.stage .nav{position:absolute;top:0;bottom:0;width:18%;border:0;background:transparent;cursor:pointer;opacity:0;display:flex;align-items:center;padding:0 10px}
.stage .nav:hover,.stage .nav:focus-visible{opacity:1}
.stage .nav span{background:var(--scrim);color:#fff;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;font-size:20px}
.stage .nav.l{left:0;justify-content:flex-start}.stage .nav.r{right:0;justify-content:flex-end}
.pager{display:flex;align-items:center;gap:8px;font:14px var(--f-mono);font-variant-numeric:tabular-nums}
.pager input{width:56px;font:14px var(--f-mono);text-align:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:0 0 auto;border:2px solid transparent;border-radius:6px;padding:0;background:var(--surface);cursor:pointer;position:relative;overflow:hidden}
.thumbs button.cur{border-color:var(--copper)}
.thumbs img{display:block;height:62px;width:auto;background:#fff}
.thumbs span{position:absolute;right:2px;bottom:2px;font:10px var(--f-mono);background:var(--scrim);color:#fff;border-radius:3px;padding:0 3px}
.inlesson{font-size:14px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px))}
.lb .bar{display:flex;gap:8px;align-items:center;color:#fff;font:14px var(--f-mono);padding-bottom:8px}
.lb .bar .sp{flex:1}
.lb .bar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.lb .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px}

/* tutorial */
.tut{display:grid;gap:14px;max-width:80ch}
.titem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.titem .th,.pbody .th{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px var(--f-mono);color:var(--ink-3)}
.titem .th b{color:var(--pcb);font-weight:600}
.titem .q{font-size:16px}
.titem .ans{border-top:1px dashed var(--line);padding-top:12px}

/* quiz */
.quiz{max-width:76ch;display:grid;gap:16px}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:13px var(--f-mono);color:var(--ink-3)}
.qmeta .sp{flex:1}
.qbar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--copper)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px;box-shadow:var(--shadow)}
.qcard .q{font-size:18px;line-height:1.5}
.qcard .tag{font:12px var(--f-mono);color:var(--pcb)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--bg);
  border-radius:8px;padding:10px 12px;cursor:pointer;font-size:15px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--copper)}
.opt .k{font:600 13px/26px var(--f-mono);width:26px;height:26px;text-align:center;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:var(--bg)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .k{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.55}
.explain{border-radius:8px;padding:12px 14px;display:grid;gap:8px;font-size:15px}
.explain.ok{background:var(--ok-soft)} .explain.no{background:var(--bad-soft)}
.explain .verdict{font:700 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.explain.ok .verdict{color:var(--ok)} .explain.no .verdict{color:var(--bad)}
.qnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qnav .sp{flex:1}
.kbd{font:12px var(--f-mono);color:var(--ink-3)}
.result{display:grid;gap:14px}
.score{font:800 clamp(52px,9vw,88px)/1 var(--f-display);color:var(--pcb)}
.missed{display:grid;gap:8px}
.missed .mi{background:var(--surface);border:1px solid var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:6px}

/* cards */
.cards{max-width:720px;display:grid;gap:14px}
.flip{perspective:1400px;cursor:pointer;border:0;background:transparent;padding:0;text-align:left;width:100%}
.flip .inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:260px;border-radius:14px;padding:26px 28px;
  display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--surface);border-color:var(--copper)}
.face .lab{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.face .txt{font-size:21px;line-height:1.45;margin:auto 0}
.face.back .txt{font-size:18px}
.face .hint{font:12px var(--f-mono);color:var(--ink-3)}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crow .sp{flex:1}
.btn.r-know{border-color:var(--ok);color:var(--ok)} .btn.r-learn{border-color:var(--bad);color:var(--bad)}
.cstat{font:13px var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}

/* search */
.sres{display:grid;gap:18px;max-width:84ch}
.sres h3{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.hit{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.hit:hover{border-color:var(--copper)}
.hit .w{font:12px var(--f-mono);color:var(--pcb)}
.hit .s{font-size:14px;color:var(--ink-2)}
.hit mark{background:var(--copper-soft);color:var(--ink);border-radius:2px}
.empty{color:var(--ink-2);padding:20px 0}

/* exam-style practice, marks and self-grading */
.must{font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--copper);border:1px solid var(--copper);border-radius:999px;padding:4px 8px;white-space:nowrap}
.marks{font:600 12px var(--f-mono);color:var(--pcb);white-space:nowrap}
.grade{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grade .kbd{margin-right:4px}
.btn.g1.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.btn.g05.on{background:var(--tip-soft);border-color:var(--tip);color:var(--ink)}
.btn.g0.on{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.subh{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:14px}
figure.cells{margin:0;display:grid;gap:6px;min-width:0}
.cellfig{display:grid;gap:10px;overflow-x:auto;padding-bottom:4px;justify-content:start}
.cblk{border:1.5px solid var(--ink-3);border-radius:6px;padding:6px;background:var(--surface)}
.cblk .bl{font:600 12px var(--f-mono);color:var(--ink-2);margin-bottom:5px}
.cblk table{border-collapse:collapse}
.cblk td{border:1px solid var(--line);padding:3px 6px;font:12px/1.4 var(--f-mono);text-align:center;min-width:2.8em;background:var(--bg);white-space:nowrap}
.cblk td.hl{background:var(--copper-soft);border-color:var(--copper);font-weight:700}
figure.cells figcaption{font-size:13px;color:var(--ink-2)}
.paper{max-width:84ch;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.pq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.pq > h3{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;font-size:19px}
.pp{display:grid;grid-template-columns:2em minmax(0,1fr);gap:8px}
.pp + .pp{border-top:1px dashed var(--line);padding-top:16px}
.pp .pn{font:600 14px/1.6 var(--f-mono);color:var(--ink-3)}
.pp.solo{grid-template-columns:minmax(0,1fr)}
.pbody{display:grid;gap:10px;min-width:0;grid-template-columns:minmax(0,1fr)}
.pbody .ans{border-top:1px dashed var(--line);padding-top:10px}
.scorebar{position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--line);padding-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
.scorebar .big{font:800 30px/1 var(--f-display);color:var(--pcb);font-variant-numeric:tabular-nums}

/* ===== one section per page: index, stopwatch, section questions ===== */
.toc .tocd summary{cursor:pointer;font-weight:700;font-size:13px;padding:4px 0;list-style:none}
.toc .tocd summary::-webkit-details-marker{display:none}
.toc .tocd summary::before{content:"\25B8 ";display:inline-block;transition:transform .15s}
.toc .tocd[open] summary::before{transform:rotate(90deg)}
.toc ol{list-style:none;margin:8px 0 0;padding:0;position:relative}
.toc ol li{margin:0}
.toc ol a{display:grid;grid-template-columns:1.9em minmax(0,1fr) auto;align-items:baseline;gap:8px;padding:6px 8px;border-radius:7px;
  text-decoration:none;color:inherit;font-size:13px;border-left:2px solid transparent}
.toc ol a:hover{background:var(--surface-2)}
.toc ol a.cur{background:var(--surface-2);border-left-color:var(--copper);font-weight:700}
.toc ol a.done span{opacity:.55;text-decoration:line-through}
.toc ol a.done i::after,.railsec.done i::after{content:" \2713";color:var(--ok)}
.toc ol a i,.railsec i{font-style:normal;opacity:.55;font-variant-numeric:tabular-nums;white-space:nowrap}
.toc ol a em,.railsec em{font-style:normal;opacity:.55;font-size:11px;font-variant-numeric:tabular-nums}
.toc-sum{margin:9px 0 0;font-size:12px;color:var(--ink-2)}
.ovlink{font-size:13px;color:var(--ink-2)}

#swslot{flex:0 0 auto;display:flex;align-items:center}
#swslot:empty{display:none}
.sw.swc{display:flex;align-items:center;gap:7px;padding:4px 9px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  font:600 12px/1 var(--f-mono);white-space:nowrap}
.sw .swdot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sw[data-state="run"] .swdot{background:var(--ok)}
.sw[data-state="idle"] .swdot,.sw[data-state="manual"] .swdot{background:var(--tip)}
.sw .swt{font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.02em}
.sw .swe{color:var(--ink-3);font-weight:400;font-size:11px}
.sw .sws{display:none}
.sw[data-state="done"] .swt,.sw[data-state="idle"] .swt,.sw[data-state="manual"] .swt{opacity:.5}
.sw .swb{display:flex;gap:3px;margin-left:1px}
.swmini{min-width:22px;height:22px;padding:0 4px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:transparent;
  color:inherit;font:600 9px/1 var(--f-mono);cursor:pointer}
.swmini:hover:not(:disabled){border-color:var(--copper);color:var(--copper)}
.swmini:disabled{opacity:.3;cursor:default}
@media (max-width:360px){.sw .swe{display:none}}

.secnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:30px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.qskip{display:flex;justify-content:flex-end;margin:0 0 12px}
.secnav.secdone{justify-content:flex-end;margin:18px 0 34px}
.secnav > span{flex:1}
.secnav .btn{white-space:normal;text-align:left}
.secnav .btn.primary{margin-left:auto}
.secnav .btn.done{border-color:var(--ok);color:var(--ok)}

.tblwrap{overflow-x:auto;margin:18px 0 0}
table.sectable{border-collapse:collapse;width:100%;font-size:13.5px}
table.sectable th,table.sectable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sectable th{font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
table.sectable td.code{font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
table.sectable td.freq{white-space:nowrap;color:var(--ink-2);font-variant-numeric:tabular-nums}
table.sectable a{color:inherit}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;border:1px solid var(--line)}
.pill.g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.pill.m{background:var(--tip);border-color:var(--tip);color:var(--bg)}
.pill.b{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.pill.t{color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:400}

.secqs{margin:34px 0 0;padding-top:18px;border-top:2px solid var(--line);display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.secqs > h4{margin:0;font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.secqs > h4.recallh{margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.secqs .shaped{margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--copper-soft);color:var(--copper);font-size:10px;letter-spacing:.03em;text-transform:none}
.secqs .dimh{margin-left:8px;font-size:11px;text-transform:none;letter-spacing:0}
.sq{padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--surface);display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.sq .q{font-weight:600}
.sq .opts{display:grid;gap:6px}
.sq .opt{grid-template-columns:1.6em minmax(0,1fr);gap:8px;align-items:baseline;padding:8px 11px;background:var(--surface-2);color:inherit;font:inherit}
.sq .opt .ol{color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums}
.sq .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.sq .opt.picked{border-color:var(--bad);background:var(--bad-soft)}
.sq .exp{padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.5;display:grid;gap:6px}
.sq .exp b{display:block}
.sq .exp.ok{background:var(--ok-soft)} .sq .exp.ok b{color:var(--ok)}
.sq .exp.no{background:var(--bad-soft)} .sq .exp.no b{color:var(--bad)}
@media (max-width:900px){.secnav{gap:8px}.secnav .btn{flex:1 1 auto;justify-content:center;text-align:center}}
.unat{color:var(--ink-2)}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--copper);text-decoration:underline;cursor:pointer;text-align:left}

/* the left rail is the unit's section index while a unit is open */
.railhead{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-bottom:6px}
.railhead h4{margin:4px 4px 0}
ol.railsecs{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.railsec{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:7px;align-items:baseline;width:100%;text-align:left;padding:7px 9px;
  border:0;border-left:2px solid transparent;border-radius:7px;background:none;color:inherit;font:inherit;font-size:13px;cursor:pointer;line-height:1.3}
.railsec:hover{background:var(--surface)}
.railsec.cur{background:var(--surface);border-left-color:var(--copper);font-weight:700}
.railsec.done span{opacity:.55;text-decoration:line-through}
.railsec.inplan i::before{content:"\2022";color:var(--copper);margin-right:3px;font-weight:700}

/* slide mentions in lesson prose become links */
.stxt{display:inline-flex;align-items:center;gap:3px;padding:0 3px;border:0;border-radius:4px;background:var(--copper-soft);color:inherit;font:inherit;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:2px}
.stxt svg{width:11px;height:11px;stroke:var(--copper);fill:none}
.stxt:hover{background:var(--copper);color:var(--copper-ink)}
.stxt:hover svg{stroke:var(--copper-ink)}
.backsec{margin-left:auto;white-space:normal;text-align:left}
.kbd.dim{opacity:.7}

/* exam plan */
.cdbtn{font-variant-numeric:tabular-nums;border-color:var(--copper);color:var(--copper)}
.planbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;padding:10px 13px;border:1px dashed var(--line);border-radius:10px}
.planbar input,.planbar select{font:inherit;padding:4px 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:inherit}
.planbar .trn,#trbar .trn{color:var(--ink-2)}
.plantab tr.out{opacity:.5}
.plantab tr.cut td{padding:10px;text-align:center;font:600 12px var(--f-mono);letter-spacing:.04em;color:var(--copper);border-bottom:0}
.plantab tr.in td:first-child{box-shadow:inset 2px 0 0 var(--ok)}

/* audio lessons: the Listen page and a player bar that keeps playing while you browse */
.lcards{display:grid;gap:12px}
.lcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;gap:8px}
.lcard h3{margin:0;font-size:17px}
.lcard .lmeta{font:12px var(--f-mono);color:var(--ink-3)}
.lcard .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lcard details summary{cursor:pointer;color:var(--ink-2);font-size:13px}
.lsecs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.lsecs button{all:unset;cursor:pointer;display:flex;gap:10px;padding:5px 8px;border-radius:8px;font-size:14px}
.lsecs button:hover,.lsecs button:focus-visible{background:var(--surface-2);outline:2px solid var(--copper);outline-offset:-2px}
.lsecs .t{font:12px var(--f-mono);color:var(--ink-3);min-width:3.2em}
.lplayer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:35;max-width:760px;margin:0 auto;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:10px 12px;display:grid;gap:6px}
.lplayer .lrow{display:flex;align-items:center;gap:8px;min-width:0}
.lplayer .ltitle{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lplayer .lsec{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lplayer audio{width:100%;height:36px}
.lplayer select.lspeed{max-width:none;flex:0 0 auto;font-weight:700}
.lplayer select{max-width:46%;font:inherit;font-size:12px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
body.lp-on main{padding-bottom:150px}
@media (max-width:640px){.lplayer .lrow{flex-wrap:wrap}.lplayer .ltitle{flex:1 1 calc(100% - 150px)}.lplayer select:not(.lspeed){order:3;flex:1 1 100%;max-width:none}body.lp-on main{padding-bottom:190px}}
body.shorts-on .lplayer{display:none}
.srcbadge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font:700 11px/1.5 var(--f-body);border:1px solid}
.srcbadge.ok{background:var(--ok-soft,rgba(88,204,148,.14));color:var(--ok);border-color:var(--ok)}
.srcbadge.sl{background:var(--tip-soft);color:var(--tip);border-color:var(--tip)}
.ans .srcbadge{margin-bottom:2px}
.xmodes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pfilter .btn{border-style:dashed}
.xsbadge{padding:2px 8px;border-radius:999px;background:var(--tip-soft);color:var(--tip);border:1px solid var(--tip);font:700 10px/1.5 var(--f-body);
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.xsbadge.exam{background:var(--ok-soft,rgba(88,204,148,.14));color:var(--ok);border-color:var(--ok);text-transform:none;letter-spacing:0;white-space:normal}

/* written-answer boxes */
details.ansbox{margin:0}
details.ansbox > summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2);padding:3px 0}
details.ansbox > summary::-webkit-details-marker{display:none}
details.ansbox > summary::before{content:"\270E";font-size:13px}
details.ansbox > summary:hover{color:var(--copper)}
details.ansbox[open] > summary{margin-bottom:6px}
.ansbox textarea{width:100%;min-height:60px;resize:vertical;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  font:15px/1.55 var(--f-body);overflow:hidden;display:block}
.ansbox textarea:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 1px var(--copper)}
.ansbox textarea::placeholder{color:var(--ink-3)}
.anshint{font:12px var(--f-mono);color:var(--ink-3);margin-top:4px;text-align:right}

/* the section index aside: only below 1101px, where it is the way around a unit (the rail carries it on wide screens) */
@media (min-width:1101px){.learn{grid-template-columns:minmax(0,72ch)}.toc{display:none}}
@media (max-width:1100px){
  .learn{grid-template-columns:minmax(0,1fr)}
  .toc{display:block;position:static;top:auto;max-height:none;overflow:visible;border:1px solid var(--line);border-radius:12px;padding:11px 14px;
    background:var(--surface);margin:0 0 20px;align-self:auto}
  .toc .tocd summary{font-size:14px;padding:2px 0}
  .toc ol{max-height:46vh;overflow-y:auto}
}

/* final revision page */
.scope{font-size:14px;color:var(--ink-2);border-left:2px solid var(--copper);padding-left:12px}
.rjump{display:flex;gap:6px;flex-wrap:wrap}
.rpart{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line);
  font:700 19px/1.2 var(--f-body);scroll-margin-top:calc(var(--toph,46px) + 16px)}
.rpart .mono{font:400 12px/1.3 var(--f-mono);color:var(--ink-3)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:12px;align-items:start}
.rcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.rcard h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font:700 15px/1.3 var(--f-body)}
.rcard ul{margin:0;padding-left:17px;display:grid;gap:6px;font-size:14px;line-height:1.5}
.rcard p{font-size:14px;color:var(--ink-2)}
.rcard table{font-size:13px}
.rcard.warn{border-color:var(--bad);background:var(--bad-soft)}
.rcard.warn > h3{color:var(--bad)}
.rpage .rpart:first-child{margin-top:8px}
.rcard code{font-size:.9em;background:var(--surface-2);border-radius:4px;padding:.05em .3em}
.rlink{flex:none;background:none;border:0;padding:0;cursor:pointer;font:600 12px/1 var(--f-mono);color:var(--copper);white-space:nowrap}
.rlink:hover{text-decoration:underline}
.rformula{white-space:pre-wrap;font:13px/1.6 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}

/* time estimate and frequency beside a section title */
.lsec h3 .secest{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  font:600 11px/1 var(--f-mono);color:var(--ink-2);letter-spacing:.02em;white-space:nowrap}
.fbadge{display:inline-block;padding:3px 9px;border-radius:999px;font:700 10px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;border:1px solid transparent}
.fbadge.f3{background:var(--copper);color:var(--copper-ink)}
.fbadge.f2{background:var(--copper-soft);color:var(--copper);border-color:var(--copper)}
.fbadge.f1,.fbadge.f0{background:transparent;color:var(--ink-2);border-color:var(--line)}
.fdot{margin-left:6px;font-size:7px;letter-spacing:1px;vertical-align:middle;white-space:nowrap}
.fdot.f3,.fdot.f2{color:var(--copper)}
.fdot.f1{color:var(--ink-3)}
.fdot.f0{color:var(--ink-3);opacity:.6}

/* symbol glossary */
.gl{border-bottom:1px dotted var(--copper);cursor:help}
#glpop{position:fixed;z-index:70;max-width:min(310px,calc(100vw - 16px));padding:9px 11px;border-radius:9px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);font:13px/1.45 var(--f-body);box-shadow:0 8px 26px rgba(0,0,0,.25);opacity:0;transform:translateY(3px);pointer-events:none;
  transition:opacity .12s ease,transform .12s ease}
#glpop.on{opacity:1;transform:none}
#glpop b{display:block;font-family:var(--f-mono);margin-bottom:3px;color:var(--copper)}
#glpop i{display:block;margin-top:5px;font-style:normal;color:var(--ink-2);font-size:12px}

/* recommended triage on the Practice tab */
.rec{padding:2px 8px;border-radius:999px;background:var(--copper);color:var(--copper-ink);font:700 10px/1.5 var(--f-body);letter-spacing:.05em;text-transform:uppercase;cursor:help}
.titem.dimmed{opacity:.55}
.titem.dimmed:hover,.titem.dimmed:focus-within{opacity:1}
#trbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border-radius:10px;border:1px dashed var(--line);font-size:14px}
#trbar select{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:inherit}
@media (prefers-reduced-motion: reduce){#glpop,.toc .tocd summary::before{transition:none}}


/* shorts feed */
body.shorts-on{padding-block:0}
.sfeed{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);padding-top:4px}
.schips{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.schips::-webkit-scrollbar{display:none}
.schips .btn{flex:0 0 auto}
.sscroll{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:none}
.sscroll::-webkit-scrollbar{display:none}
.sitem{scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.sstage{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-end;gap:14px}
.sframe{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.sframe video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.spaused{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.sframe.paused .spaused{display:grid}
.spaused svg{width:76px;height:76px;fill:rgba(255,255,255,.88);filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}

/* ---------- text helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inl(s){
  if (s == null) return "";
  const codes = [];
  let t = String(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = esc(t)
    .replace(/\*\*((?:[^*]|\*(?!\*))+?)\*\*/g, "<strong>$1</strong>")   /* a lone * (N*M) may sit inside bold */
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![\w*])/g, "$1<em>$2</em>");
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => "<code>" + esc(codes[+i]) + "</code>");
}
/* Code highlighting, keyed on the language. S.hl holds only the languages this course uses (the build picks them):
   {lang: {kw, q (qualifiers), bi (built-ins), api (regex source), line (comment start), block, pp, launch, triple, tpl, ci}} */
const HL = {};
Object.keys(S.hl || {}).forEach(k => {
  const d = S.hl[k], set = s => new Set((s || "").split(" ").filter(Boolean));
  const ci = !!d.ci, cmt = [];
  if (d.line) cmt.push(d.line.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&") + "[^\\n]*");
  if (d.block) cmt.push("\\/\\*[\\s\\S]*?\\*\\/");
  const str = (d.triple ? ['"""[\\s\\S]*?"""', "'''[\\s\\S]*?'''"] : []).concat(['"(?:\\\\.|[^"\\\\\\n])*"', "'(?:\\\\.|[^'\\\\\\n])*'"], d.tpl ? ["`(?:\\\\.|[^`\\\\])*`"] : []);
  const re = "(" + (cmt.join("|") || "(?!)") + ")|(" + str.join("|") + ")|(" + (d.pp ? "^[ \\t]*#[ \\t]*\\w+" : "(?!)") + ")|(" + (d.launch ? "<<<|>>>" : "(?!)") + ")|(\\b\\d+(?:\\.\\d+)?[fFuUlL]*\\b)|([A-Za-z_]\\w*)";
  HL[k] = { re, ci, kw: set(ci ? (d.kw || "").toLowerCase() : d.kw), q: set(d.q), bi: set(d.bi), api: d.api ? new RegExp(d.api, ci ? "i" : "") : null };
});
function hl(src, lang){
  const L = HL[lang];
  if (!L) return esc(src);
  const re = new RegExp(L.re, "gm");
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    if (!m[0]) { re.lastIndex++; continue; }
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const t = esc(m[0]);
    if (m[1]) out += '<span class="c">' + t + "</span>";
    else if (m[2]) out += '<span class="st">' + t + "</span>";
    else if (m[3]) out += '<span class="pp">' + t + "</span>";
    else if (m[4]) out += '<span class="ln">' + t + "</span>";
    else if (m[5]) out += '<span class="nm">' + t + "</span>";
    else {
      const w = m[6];
      if (L.q.has(w)) out += '<span class="cu">' + t + "</span>";
      else if (L.bi.has(w)) out += '<span class="bi">' + t + "</span>";
      else if (L.kw.has(L.ci ? w.toLowerCase() : w)) out += '<span class="kw">' + t + "</span>";
      else if (L.api && L.api.test(w)) out += '<span class="api">' + t + "</span>";

/* Slide images. github-pages and file: one file per page, slides/<deck>/pNNN.webp, plus 200 px thumbnails (tools/make_thumbs.py).
   artifact: no loose files; build.py packs each deck's pages into slides/<deck>.N.js, scripts that set
   window.__SLIDES__[deck][page] to a data URI (S.packs: deck -> [[n, first page, last page, version], ...]). An image made with
   slideImg() starts as a transparent placeholder carrying data-sd/data-sp; when it comes near the screen its pack is loaded
   (one script tag per pack, cached) and the src is filled in. Nothing is loaded at start. */
const PACKS = S.packs || null;
const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

  if (!x || packed(deck, page)) return Promise.resolve();
  const k = deck + "." + x[0];
  return packLoads[k] || (packLoads[k] = new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "slides/" + encodeURIComponent(deck) + "." + x[0] + ".js?v=" + x[3];
    s.onload = () => {   // fill every waiting image of this deck at once, so nothing depends on the observer firing
      document.querySelectorAll("img[data-sd]").forEach(img => {
        if (img.dataset.sd === deck && img.getAttribute("src") === BLANK) { const u = packed(deck, +img.dataset.sp); if (u) img.src = u; }
      });

function slideSrc(deck, page){ return PACKS ? packed(deck, page) || BLANK : "slides/" + deck + "/p" + pad3(page) + ".webp"; }
function thumbSrc(deck, page){ return S.thumbs ? "slides/" + deck + "/t/p" + pad3(page) + ".webp" : slideSrc(deck, page); }

function slideImg(deck, page, thumb){

/* minutes for one written practice problem, by kind; marks break ties */
function pracMinutes(p){
  const t = (p.topic || "").toLowerCase(), m = p.marks || 2;
  /* a multiple-choice part or one worth half a mark or less takes about as long as a quiz question */
  if (p.choices || m <= 0.5) return 1;
  if (/index|figure|diagram|draw/.test(t)) return 6;
  if (/\b(code|program|loop)\b|write a|implement/.test(t)) return 10;
  if (/calculat|compute|work out/.test(t)) return 4;
  if (/definition|terms|give the|enumerate|list/.test(t)) return 3;
  return Math.max(3, Math.min(10, Math.round(m * 1.8)));
}

/* per-section derived data: number, minutes, and the quiz, practice and card items that belong to it */
const SEC = (() => {
  const cache = new Map();

/* ---------- section stopwatch ----------
   Runs while a section page is open. Pauses after 3 minutes without scrolling, pointer movement, touch or typing

  const fmt = ms => {
    const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60, p = n => String(n).padStart(2, "0");

    hidden: "Paused while the tab is hidden", done: "Section done: timer stopped. Mark it not done to resume" };
  function tick(){
    if (!cur) return;

    else if (w !== "run" && running) { commit(w === "idle" ? lastAct : Date.now()); running = false; }
    else if (running && Date.now() - last > 15000) commit();

  }

    const el = cur.el, est = SEC(cur.u, cur.i).min;
    el.querySelector(".swt").textContent = fmt(total());
    el.dataset.state = w;
    el.querySelector(".sws").textContent = MSG[w] || "";

    const b = el.querySelector("[data-swp]");

    b.setAttribute("aria-label", cur.manual ? "Resume the section timer" : "Pause the section timer");
    b.title = cur.manual ? "Resume" : "Pause";

  ["scroll", "wheel", "mousemove", "pointerdown", "keydown", "touchstart", "input"].forEach(ev => addEventListener(ev, act, { passive: true, capture: true }));

    el.querySelector("[data-swr]").addEventListener("click", e => {
      const b = e.currentTarget;
      if (!resetArm) {
        resetArm = setTimeout(() => { resetArm = 0; b.textContent = "↺"; b.setAttribute("aria-label", "Reset the section timer"); }, 3000);
        b.textContent = "Reset?"; b.setAttribute("aria-label", "Press again to reset the section timer");
        return;
      }
      clearTimeout(resetArm); resetArm = 0;

      running = false; delete store.sw[key()]; save(); tick();
    });

    if (!keepSlot) { const slot = document.getElementById("swslot"); if (slot) slot.innerHTML = ""; }
  }

})();

  root.querySelectorAll(".lsec .blocks p, .lsec .blocks li, .sq .q").forEach(pr => {
    const walker = document.createTreeWalker(pr, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      re.lastIndex = 0;
      return re.test(t.nodeValue) && !t.parentElement.closest("a,button,code,pre,.chip,.tag") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    } });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(t => {
      const frag = document.createDocumentFragment(), v = t.nodeValue;
      let lastEnd = 0, m; re.lastIndex = 0;
      while ((m = re.exec(v))) {
        const n = +m[2];
        if (n < first(d) || n > d.pages) continue;
        frag.append(v.slice(lastEnd, m.index));
        const a = document.createElement("button");
        a.className = "stxt"; a.type = "button"; a.dataset.act = "slideto"; a.dataset.deck = u.deck; a.dataset.page = n; a.title = "Open slide " + n;
        a.innerHTML = ICON_SLIDE; a.append(m[0]);
        frag.append(a); lastEnd = m.index + m[0].length;

}
/* the first section that discusses a slide page, for the "back to section" button on the Slides tab */
function sectionForSlide(u, page){ return u.sections.findIndex(s => (s.slides || []).includes(page)); }

/* ---------- how often each section comes up ----------
   One number per section (its "freq"), 0 (rare) to 5 (comes up nearly every time), set only from past-paper
   evidence. It drives the badges, the index dots and the study-plan ordering. A section without it is unknown:
   no badge, no dots, and a neutral place in the plan. */
/* sections[].freq in the unit's content file (0 to 5); null when it is missing */
function secFreq(u, i){ const v = (u.sections[i] || {}).freq; if (v == null || v === "" || isNaN(+v)) return null; return Math.min(5, Math.max(0, +v)); }
const FREQ_UNKNOWN = 2.5;            /* the plan's weight for a section with no freq: the middle of 0 to 5 */
function freqTier(f){ return f >= 4 ? 3 : f === 3 ? 2 : f >= 1 ? 1 : 0; }
const FREQ_NAME = ["Rare", "Sometimes", "Common", "Very common"];
function unitHasFreq(u){ return u.sections.some((s, i) => secFreq(u, i) != null); }
function anyFreq(){ return U.some(unitHasFreq); }
function freqBadge(u, i){
  const f = secFreq(u, i); if (f == null) return "";
  const t = freqTier(f);
  return '<span class="fbadge f' + t + '" title="How often this topic comes up">' + FREQ_NAME[t] + "</span>";
}
function freqDot(u, i){
  const f = secFreq(u, i); if (f == null) return "";
  const t = freqTier(f);
  return '<span class="fdot f' + t + '" title="How often this topic comes up: ' + FREQ_NAME[t].toLowerCase() + '" aria-hidden="true">' +
    (t ? "●".repeat(t) : "○") + '</span><span class="vh">, ' + FREQ_NAME[t].toLowerCase() + "</span>";
}

/* ---------- study plan and countdown ----------
   The exam is at a fixed time and the lab holds more than fits, so the plan ranks what is left and draws a line
   where the hours you have run out. */
const EXAM_AT = C.exam && C.exam.at ? new Date(C.exam.at) : null;
function msToExam(){ return EXAM_AT && !isNaN(EXAM_AT) ? EXAM_AT - Date.now() : 0; }
function fmtCountdown(ms){
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return h >= 24 ? Math.floor(h / 24) + "d " + (h % 24) + "h" : h + "h " + m + "m";
}
function countdownText(){ const ms = msToExam(); return ms > 0 ? "Exam in " + fmtCountdown(ms) : "Study plan"; }
/* how much a unit weighs: the marks its own written practice carries */
function unitWeight(u){ return (u.practice || []).reduce((a, p) => a + (p.marks || 2), 0); }
function planRows(){
  const mw = Math.max.apply(null, U.map(unitWeight)) || 1, rows = [];
  U.forEach(u => {
    if (NOT_IN.has(u.id)) return;               // not in this exam: no place in the plan
    const w = unitWeight(u) / mw;
    u.sections.forEach((s, i) => {
      const m = SEC(u, i);
      const asked = m.quiz.filter(q => store.quiz[q.id] != null).length, wrong = m.quiz.filter(q => store.quiz[q.id] === 0).length;
      /* how often the topic comes up dominates, then must-know, the unit's weight and your wrong answers */
      const f = secFreq(u, i);
      const score = (f == null ? FREQ_UNKNOWN : f) * 4 +(s.priority === "high" ? 1 : 0) + w * 1.5 + wrong * 1.5 + (m.prac.length ? 1 : 0) + (asked === 0 ? 0.5 : 0);
      rows.push({ u, i, m, s, score, done: isRead(u, i), wrong });
    });
  });
  rows.sort((a, b) => b.score - a.score || a.m.min - b.m.min);
  return rows;
}
const PLAN_HOURS = [1, 2, 3, 4, 5, 6, 8, 10, 12, 14, 16, 20];
function planHours(){
  let v = null;
  try { v = localStorage.getItem(LS + "plan-hours"); } catch(e) {}
  if (v != null && +v > 0) return +v;
  const d = Math.max(1, Math.min(14, Math.round(Math.max(0, msToExam()) / 3600000 / 3)));     // default: a third of the time left, up to 14 h
  return PLAN_HOURS.reduce((a, b) => Math.abs(b - d) < Math.abs(a - d) ? b : a);
}
let PLAN = null;
function plan(){
  if (PLAN) return PLAN;
  const cap = planHours() * 60, set = new Set();
  let used = 0;
  planRows().forEach(r => { if (r.done || used + r.m.min > cap) return; used += r.m.min; set.add(secKey(r.u, r.i)); });
  return (PLAN = { set, used, cap });
}
function planReset(){ PLAN = null; }
function viewPlan(){
  const rows = planRows(), hrs = planHours(), cap = hrs * 60, left = rows.filter(r => !r.done);
  const totalLeft = left.reduce((a, r) => a + r.m.min, 0), doneMin = rows.filter(r => r.done).reduce((a, r) => a + r.m.min, 0);
  let used = 0, cutAt = -1;
  const marked = left.map((r, n) => { const fits = used + r.m.min <= cap; if (fits) used += r.m.min; else if (cutAt < 0) cutAt = n; return { r, fits }; });
  const body = marked.map((x, n) => { const r = x.r;
    return (n === cutAt ? '<tr class="cut"><td colspan="5">everything below this line does not fit in ' + hrs + " h</td></tr>" : "") +
      '<tr class="' + (x.fits ? "in" : "out") + '"><td class="code">' + esc(r.u.code) + " §" + r.m.num + "</td>" +
      '<td><button class="lnk" data-act="sec" data-unit="' + r.u.id + '" data-sec="' + (r.i + 1) + '">' + inl(r.s.title) + "</button> " + freqBadge(r.u, r.i) +
        (r.s.priority === "high" ? ' <span class="must">Must know</span>' : "") + "</td>" +
      '<td class="freq">' + r.m.min + " min</td><td class=\"freq\">" + (r.m.quiz.length + r.m.prac.length || "-") + "</td>" +
      "<td>" + (r.wrong ? '<span class="pill b">' + r.wrong + " wrong</span>" : "") + "</td></tr>";
  }).join("");
  const ms = msToExam();
  return '<section class="uhead"><div class="row"><span class="code">Plan</span><h2>What to cover before the exam</h2></div>' +
      "<p>" + (ms > 0 ? esc(THE_EXAM_C) + " is on " + EXAM_AT.toLocaleString("en-GB", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) +
        ", <b>" + fmtCountdown(ms) + "</b> from now. " : "") +
      "The lab holds " + fmtH(totalLeft) + " of unread material" + (doneMin ? " (" + fmtH(doneMin) + " already marked done)" : "") +
      ", so this orders it and cuts where your hours run out. Sections in the plan carry a copper dot in a unit's section index.</p></section>" +
    '<div class="planbar"><label for="plh"><b>Hours I can actually study</b></label>' +
      '<select id="plh" data-act="plh">' + PLAN_HOURS.concat(PLAN_HOURS.includes(hrs) ? [] : [hrs]).sort((a, b) => a - b).map(h => '<option value="' + h + '"' + (h === hrs ? " selected" : "") + ">" + h + " h</option>").join("") + "</select>" +
      '<span class="trn">fills ' + fmtH(Math.min(used, cap)) + " of " + fmtH(cap) + "</span></div>" +
    '<p class="subh">Ranked by ' + (anyFreq() ? "how often the topic comes up, then " : "") + "must-know, the marks the unit carries, and questions you got wrong</p>" +
    (left.length ? '<div class="tblwrap"><table class="sectable plantab"><thead><tr><th scope="col">Where</th><th scope="col">Section</th><th scope="col">Time</th><th scope="col">Qs</th><th scope="col"><span class="vh">Wrong answers</span></th></tr></thead><tbody>' + body + "</tbody></table></div>"
      : '<p class="empty">Every section is marked done. Try the mock exam.</p>');
}

/* ---------- audio lessons ---------- */
const AU = S.audio || [], AUM = Object.fromEntries(AU.map(a => [a.id, a]));
const UNIT_AUDIO = C.audioUnits || {};            /* unit id -> audio lesson id (course.json audio.units) */
const LPLAY = '<svg viewBox="0 0 24 24" aria-hidden="true" width="15" height="15"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
function mmss(t){ t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
function lfile(a){ return a.title.replace(/[:\\/*?"<>|]/g, " -") + ".mp3"; }
const RATES = [0.75, 1, 1.25, 1.5, 1.75, 2];
/* One audio element for the whole visit: switching lessons only changes its source, so the next chapter can start by
   itself when one ends (phones allow that for an element that is already playing). Where you were is kept per lesson
   (<slug>-listen) and as the lesson you were on last (<slug>-listen-last), so "Continue" picks up there. */
const Listen = {
  KEY: LS + "listen", LAST: LS + "listen-last", cur: null, au: null,
  pos(id){ try { return (JSON.parse(localStorage.getItem(this.KEY) || "{}")[id]) || 0; } catch(e) { return 0; } },
  rate(){ let r = 1; try { r = +localStorage.getItem(LS + "listen-rate") || 1; } catch(e) {} return RATES.includes(r) ? r : 1; },
  savePos(id, t){ try { const d = JSON.parse(localStorage.getItem(this.KEY) || "{}"); d[id] = Math.round(t); localStorage.setItem(this.KEY, JSON.stringify(d)); localStorage.setItem(this.LAST, id); } catch(e) {} },
  last(){ let id = null; try { id = localStorage.getItem(this.LAST); } catch(e) {} return AUM[id] ? id : null; },
  next(id){ const i = AU.findIndex(a => a.id === id); return i >= 0 && i < AU.length - 1 ? AU[i + 1] : null; },
  secAt(a, t){ let s = a.chapters[0]; a.chapters.forEach(c => { if (c.start <= t + 0.5) s = c; }); return s; },
  button(uid){
    const a = HAS.audio && AUM[UNIT_AUDIO[uid]]; if (!a) return "";
    return '<button class="btn scrambtn" data-act="lplay" data-id="' + esc(a.id) + '">' + LPLAY + "Listen <span>" + Math.round(a.duration / 60) + " min audio lesson</span></button>";
  },
  build(){
    const box = $("#lplayer");
    box.innerHTML = '<div class="lrow"><span class="ltitle"></span>' +
      '<select class="lsecsel" aria-label="Jump to a section"></select>' +
      '<select class="lspeed" aria-label="Playback speed">' + RATES.map(r => '<option value="' + r + '"' + (r === this.rate() ? " selected" : "") + ">" + r + "×</option>").join("") + "</select>" +
      (PACKS ? "" : '<a class="btn sm ldl" download>Download</a>') +   // an Artifact page cannot hand out files
      '<button class="btn sm" data-act="lclose" aria-label="Close the player">&times;</button></div>' +
      '<audio controls preload="metadata"></audio><div class="lsec" aria-live="polite"></div>';
    const au = this.au = box.querySelector("audio"), sel = box.querySelector(".lsecsel"), spd = box.querySelector(".lspeed"), lab = box.querySelector(".lsec");
    const setRate = r => { au.defaultPlaybackRate = au.playbackRate = r; try { au.preservesPitch = true; } catch(e) {} };
    setRate(this.rate());

    spd.addEventListener("change", () => { const r = +spd.value; try { localStorage.setItem(LS + "listen-rate", String(r)); } catch(e) {} setRate(r); });

      if (sel.value !== String(sc.start)) sel.value = String(sc.start);

    });

      const a = AUM[this.cur]; if (!a) return;

      } catch(e) {}

  },
  load(a){

    box.querySelector(".lsecsel").innerHTML = a.chapters.map(c => '<option value="' + c.start + '">' + esc(c.title) + "</option>").join("");

/* ---------- recommended triage on the Practice tab: one problem per distinct skill, within a time budget ---------- */
/* skills come from course.json "skills": [[regex, name], ...]; a problem whose topic matches none is its own skill */
const SKILL = (C.skills || []).map(s => { try { return [new RegExp(s[0], "i"), s[1]]; } catch(e) { return null; } }).filter(Boolean);
function skillOf(topic){ const t = topic || ""; for (const s of SKILL) if (s[0].test(t)) return s[1]; return t || "Other"; }
const BUDGETS = [["all", "No limit", Infinity], ["90", "90 min", 90], ["45", "45 min", 45], ["20", "20 min", 20]];
function budget(){ let b = "all"; try { b = localStorage.getItem(LS + "budget") || "all"; } catch(e) {} return BUDGETS.some(x => x[0] === b) ? b : "all"; }
function triage(u){
  const b = budget(), cap = BUDGETS.find(x => x[0] === b)[2];
  const practised = p => store.practice[p.id] != null, mins = p => Math.max(3, Math.round((p.marks || 2) * 2.5));
  const order = (a, c) => practised(a) !== practised(c) ? (practised(a) ? 1 : -1) : (c.marks || 0) - (a.marks || 0);   // unpractised first, then heavier
  const bySkill = {};
  (u.practice || []).forEach(p => { const k = skillOf(p.topic); (bySkill[k] = bySkill[k] || []).push(p); });
  const picks = Object.keys(bySkill).map(k => { const list = bySkill[k].slice().sort(order); return { p: list[0], skill: k, more: list.length - 1 }; });
  picks.sort((x, y) => order(x.p, y.p));
  const map = {}; let total = 0, n = 0;
  picks.forEach(x => { const m = mins(x.p); if (total + m > cap) return; total += m; n++; map[x.p.id] = { skill: x.skill, more: x.more, min: m }; });
  return { budget: b, map, mins: total, n, skills: picks.length };
}
function triageBar(res){
  return '<div id="trbar"><label for="trsel"><b>Time I have</b></label><select id="trsel" data-act="trsel">' +
    BUDGETS.map(x => '<option value="' + x[0] + '"' + (x[0] === res.budget ? " selected" : "") + ">" + x[1] + "</option>").join("") + "</select>" +
    '<span class="trn">' + (res.budget === "all" ? res.skills + " distinct skills in this unit"
      : res.n ? res.n + " problem" + (res.n === 1 ? "" : "s") + " · about " + res.mins + " min · one per skill, unpractised and heaviest first" : "Nothing fits that budget here.") + "</span></div>";
}
function recBadge(res, p){
  const hit = res.map[p.id];
  return hit ? '<span class="rec" title="' + esc(hit.skill + ", about " + hit.min + " min" + (hit.more ? ". " + hit.more + " other problem" + (hit.more === 1 ? "" : "s") + " in this unit drill the same skill." : "")) + '">Recommended</span>' : "";
}

/* ---------- glossary: course terms in lesson code spans explain themselves on hover, focus or tap ----------
   course/content/glossary.json: {"term": ["short meaning", "one-line note"]} */
const GLOSS = S.glossary || {};
/* every term, longest first, as one whole-word, case-sensitive pattern: a term also matches inside a longer span
   (`P(A|B) = P(A and B) / P(B)` finds P(B); `cudaMalloc(&d_a, n)` finds cudaMalloc) */
const GLOSS_RE = (() => {
  const ts = Object.keys(GLOSS).filter(Boolean).sort((a, b) => b.length - a.length);
  if (!ts.length) return null;
  try { return new RegExp("(?<![A-Za-z0-9_])(?:" + ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![A-Za-z0-9_])", "g"); }
  catch(e) { return null; }
})();
function glMark(el, key, label){
  el.dataset.gl = key; el.classList.add("gl"); el.tabIndex = 0;
  el.setAttribute("aria-label", label + ": " + GLOSS[key][0] + ". " + GLOSS[key][1]);
}
function markGloss(root){
  if (!GLOSS_RE) return;
  root.querySelectorAll("code:not([data-gl]):not(.glno)").forEach(c => {
    /* codes inside buttons, links and code blocks keep their own job: a tap there must still press the control */
    if (c.closest("button, a, summary, label, pre, [data-act]")) { c.classList.add("glno"); return; }
    const t = (c.textContent || "").trim(), key = GLOSS[t] ? t : GLOSS[t.replace(/\(\)$/, "")] ? t.replace(/\(\)$/, "") : null;
    if (key) { glMark(c, key, t); return; }
    /* a longer span: mark each term inside it on its own */
    c.classList.add("glno");
    if (c.children.length) return;
    const v = c.textContent || "", frag = document.createDocumentFragment();
    let last = 0, m, hit = false;
    GLOSS_RE.lastIndex = 0;
    while ((m = GLOSS_RE.exec(v))) {
      if (!m[0]) { GLOSS_RE.lastIndex++; continue; }
      frag.append(v.slice(last, m.index));
      const sp = document.createElement("span"); sp.textContent = m[0]; glMark(sp, m[0], m[0]);
      frag.append(sp); last = m.index + m[0].length; hit = true;
    }
    if (!hit) return;
    frag.append(v.slice(last)); c.textContent = ""; c.append(frag);

}
const Gloss = {
  pop: null, cur: null, at: 0,
  show(el){
    const g = GLOSS[el.dataset.gl]; if (!g) return;
    if (!this.pop) { this.pop = document.createElement("div"); this.pop.id = "glpop"; this.pop.setAttribute("aria-hidden", "true"); document.body.appendChild(this.pop); }
    const p = this.pop; p.textContent = "";
    [["b", el.dataset.gl], ["span", g[0]], ["i", g[1]]].forEach(x => { const n = document.createElement(x[0]); n.textContent = x[1]; p.appendChild(n); });
    p.classList.add("on"); this.cur = el; this.at = Date.now();
    const r = el.getBoundingClientRect(); p.style.left = "0px"; p.style.top = "0px";
    const pw = p.offsetWidth, ph = p.offsetHeight;
    let top = r.top - ph - 8; if (top < 8) top = r.bottom + 8;
    p.style.left = Math.min(Math.max(8, r.left), Math.max(8, innerWidth - pw - 8)) + "px"; p.style.top = top + "px";

  hide(){ if (this.pop) this.pop.classList.remove("on"); this.cur = null; }
};
document.addEventListener("pointerover", e => { if (e.pointerType !== "mouse" || !e.target.closest) return; const el = e.target.closest(".gl"); if (el) Gloss.show(el); });
document.addEventListener("pointerout", e => { if (e.pointerType !== "mouse" || !e.target.closest) return; const el = e.target.closest(".gl"); if (el && Gloss.cur === el) Gloss.hide(); });

  const el = e.target.closest ? e.target.closest(".gl") : null;
  if (el) { if (Gloss.cur === el && e.pointerType !== "mouse" && Date.now() - Gloss.at > 400) Gloss.hide(); else Gloss.show(el); }   // a tap toggles; the focus that came with it already showed it

function allPractice(){ const a = []; U.forEach(u => (u.practice || []).forEach((p, i) => a.push({ u: u.id, i, p }))); return a; }

  const pool = allPractice(), used = new Set();

    const slots = [].concat(part.slot);
    const c = shuffle(pool.filter(x => slots.includes(x.p.slot) && !used.has(x.p.id) && (!part.maxMarks || (x.p.marks || 1) <= part.maxMarks)));
    if (!c.length) return null;

function fixedPaper(id){
  const items = allPractice().filter(x => x.p.paper === id).sort((a, b) => (a.p.pq - b.p.pq) || (a.p.pp - b.p.pp));
  const by = {};
  items.forEach(x => { (by[x.p.pq] = by[x.p.pq] || []).push({ u: x.u, i: x.i }); });
  return { kind: id, qs: Object.keys(by).sort((a, b) => a - b).map(n => ({ title: "Question " + n, parts: by[n] })), graded: {} };
}

function paperIds(){
  const have = new Set(allPractice().map(x => x.p.paper).filter(Boolean)), order = Object.keys(PAPER_NAMES);

function paperKinds(ids){

/* ---------- quiz ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newQuiz(key, items, title){
  items = items.map(x => { const q = UM[x.u].quiz[x.i]; return { u: x.u, i: x.i, perm: q.kind === "mcq" ? shuffle(q.options.map((o, k) => k)) : [true, false] }; });

}

  if (onlyMissed) items = items.filter(x => store.quiz[UM[x.u].quiz[x.i].id] !== 1);
  return newQuiz("unit:" + u.id, items, u.code + " quiz");
}
function mockQuiz(){
  const pool = [];
  U.forEach(u => { const idx = shuffle(u.quiz.map((q, i) => i)); idx.forEach((i, n) => pool.push({ u: u.id, i, first: n < 2 })); });
  const firsts = pool.filter(x => x.first), rest = shuffle(pool.filter(x => !x.first));
  return newQuiz("mock", shuffle(firsts.concat(rest.slice(0, Math.max(0, QUICK_N - firsts.length)))), "Quick quiz");
}

function markLeft(el){
  const d = el.dataset.done; if (!d) return;

/* on a unit's quiz, a way past it to the next unit's first section */
function quizSkip(){

    esc(n.code) + " " + inl(n.title) + " →</button></div>" : "";
}

function quizBody(){
  const Q = st.quiz;
  if (st.view === "unit" && UM[st.unit] && !(UM[st.unit].quiz || []).length) return '<p class="empty">This unit has no quiz questions. Its practice problems and flashcards are on the other tabs.</p>';
  if (!Q || !Q.items.length) return '<p class="empty">Every question in this set is already answered correctly. <button class="btn sm" data-act="qrestart" data-all="1">Run the full quiz again</button></p>';
  if (Q.done) return quizResult(Q);
  const it = Q.items[Q.pos], u = UM[it.u], q = u.quiz[it.i];
  const a = Q.ans[Q.pos], answered = a !== undefined;
  const opts = it.perm;
  const optHtml = opts.map((val, k) => {
    const o = q.kind === "tf" ? val : q.options[val];
    let cls = "opt";
    if (answered) { if (val === q.answer) cls += " ok"; else if (val === a) cls += " no"; else cls += " dim"; }
    const label = q.kind === "tf" ? (o ? "True" : "False") : inl(o);
    return '<button class="' + cls + '" data-act="ans" data-v="' + String(val) + '" ' + (answered ? "disabled" : "") + '><span class="k">' + (q.kind === "tf" ? (o ? "T" : "F") : "ABCDEFG"[k]) + "</span><span>" + label + "</span></button>";
  }).join("");
  const right = answered && isRight(q, a);
  const nCorrect = Object.keys(Q.ans).filter(p => { const x = Q.items[p]; return isRight(UM[x.u].quiz[x.i], Q.ans[p]); }).length;
  return '<div class="quiz"><div class="qmeta"><span>' + esc(Q.title) + "</span><span>Question " + (Q.pos + 1) + " of " + Q.items.length + '</span><span class="sp"></span><span>' + nCorrect + " correct so far</span></div>" +
    '<div class="qbar"><i style="width:' + Math.round(100 * Object.keys(Q.ans).length / Q.items.length) + '%"></i></div>' +
    '<article class="qcard">' + (Q.key === "mock" ? '<span class="tag">' + esc(u.code) + " · " + esc(u.title) + "</span>" : "") +
    '<div class="q">' + inl(q.q) + "</div>" + (q.code ? codeBlock(q.code) : "") +
    '<div class="opts">' + optHtml + "</div>" +
    (answered ? '<div class="explain ' + (right ? "ok" : "no") + '"><span class="verdict">' + (right ? "Correct" : "Not quite") + "</span><div>" + inl(q.explain) + "</div><div>" + refChip(q.ref, "Taught on " + deckName(q.ref.deck) + " · p." + q.ref.page) + "</div></div>" : "") +
    "</article>" +
    '<div class="qnav"><button class="btn" data-act="qprev" ' + (Q.pos === 0 ? "disabled" : "") + '>Back</button><span class="sp"></span>' +
    '<span class="kbd">' + (q.kind === "tf" ? "T / F" : "1–" + opts.length) + " to answer, Enter for next</span>" +
    '<button class="btn primary" data-act="qnext" ' + (answered ? "" : "disabled") + ">" + (Q.pos === Q.items.length - 1 ? "See result" : "Next question") + "</button></div></div>";
}
function quizResult(Q){
  const rows = Q.items.map((x, p) => ({ x, p, q: UM[x.u].quiz[x.i], a: Q.ans[p] }));
  const ok = rows.filter(r => isRight(r.q, r.a)).length;
  const missed = rows.filter(r => !isRight(r.q, r.a));
  const pct = Math.round(100 * ok / rows.length);
  return '<div class="quiz result"><div class="qmeta"><span>' + esc(Q.title) + " finished</span></div>" +
    '<div class="score">' + ok + " / " + rows.length + "</div><p>" + pct + "% correct. " + (missed.length ? "Review the questions you missed below; each one links to the slide that teaches it." : "Every answer correct.") + "</p>" +
    '<div class="actions">' + (missed.length ? '<button class="btn primary" data-act="qretry">Retry the ' + missed.length + " missed</button>" : "") +
    '<button class="btn" data-act="qrestart">Start over</button>' + (Q.key === "mock" ? '<button class="btn" data-act="quick">New quick quiz</button>' : "") + (missed.length ? Shorts.weakButton() : "") + "</div>" +
    (missed.length ? '<div class="missed">' + missed.map(r => {
      const ans = r.q.kind === "tf" ? (r.q.answer ? "True" : "False") : inl(r.q.options[r.q.answer]);
      return '<div class="mi"><div><strong>' + (Q.key === "mock" ? esc(UM[r.x.u].code) + " · " : "") + "</strong>" + inl(r.q.q) + "</div><div>Answer: <strong>" + ans + "</strong></div><div>" + inl(r.q.explain) + "</div><div>" + refChip(r.q.ref) + "</div></div>";
    }).join("") + "</div>" : "") + "</div>";
}
function answer(v){
  const Q = st.quiz; if (!Q || Q.done || Q.ans[Q.pos] !== undefined) return;
  const it = Q.items[Q.pos], q = UM[it.u].quiz[it.i];
  const val = q.kind === "tf" ? (v === "true" || v === true) : +v;
  Q.ans[Q.pos] = val;
  store.quiz[q.id] = isRight(q, val) ? 1 : 0; save();
  render(true);
}

/* ---------- cards ---------- */
function cardKey(c){ return UM[c.u].cards[c.i].id; }
function newCards(key, items, title){ return { key, all: items, items: items.slice(), pos: 0, flip: false, filter: "all", shuffled: false, title }; }
function applyCardFilter(C){
  let it = C.all.slice();
  if (C.filter === "learning") it = it.filter(c => store.cards[cardKey(c)] !== 1);
  if (C.shuffled) shuffle(it);
  C.items = it; C.pos = 0; C.flip = false;
}
function viewCards(){
  const C = st.cards;
  const known = C.all.filter(c => store.cards[cardKey(c)] === 1).length;
  const head = '<div class="crow"><button class="btn sm' + (C.filter === "all" ? " on" : "") + '" data-act="cfilter" data-v="all">All ' + C.all.length + "</button>" +

    '<button class="btn sm' + (C.shuffled ? " on" : "") + '" data-act="cshuffle">Shuffle</button><span class="sp"></span><span class="cstat">' + known + " of " + C.all.length + " known</span></div>";
  if (!C.items.length) return '<div class="cards">' + head + '<p class="empty">No cards left in this filter. Every card here is marked as known.</p></div>';
  const c = C.items[C.pos], u = UM[c.u], card = u.cards[c.i];
  const mark = store.cards[cardKey(c)];
  return '<div class="cards">' + (C.title ? '<div class="qmeta"><span>' + esc(C.title) + "</span></div>" : "") + head +
    '<button class="flip' + (C.flip ? " on" : "") + '" data-act="cflip" aria-pressed="' + !!C.flip + '"><div class="inner">' +
    '<div class="face front"' + (C.flip ? ' aria-hidden="true"' : "") + '><span class="lab"><span>' + esc(u.code) + " · card " + (C.pos + 1) + " of " + C.items.length + "</span><span>" + (mark === 1 ? "known" : mark === 0 ? "learning" : "") + '</span></span><div class="txt">' + inl(card.front) + '</div><span class="hint">Tap or press Space to flip</span></div>' +
    '<div class="face back"' + (C.flip ? "" : ' aria-hidden="true"') + '><span class="lab"><span>Answer</span><span>' + esc(u.code) + '</span></span><div class="txt">' + inl(card.back) + "</div></div>" +
    "</div></button>" +
    '<div class="crow"><button class="btn" data-act="cprev" ' + (C.pos === 0 ? "disabled" : "") + ">&larr; Back</button>" +
    '<button class="btn r-learn" data-act="crate" data-v="0">Still learning</button><button class="btn r-know" data-act="crate" data-v="1">I know it</button>' +
    '<button class="btn" data-act="cnext" ' + (C.pos >= C.items.length - 1 ? "disabled" : "") + '>Next &rarr;</button><span class="sp"></span>' + refChip(card.ref, "Slide") + "</div>" +
    '<p class="kbd">Space flips, arrows move, 1 = still learning, 2 = I know it.</p></div>';
}

/* ---------- search ---------- */
function snippet(text, q){
  const t = String(text).replace(/\s+/g, " ").trim(), i = t.toLowerCase().indexOf(q);
  if (i < 0) return esc(t.slice(0, 140));
  const s = Math.max(0, i - 60), e = Math.min(t.length, i + q.length + 80);
  return (s > 0 ? "…" : "") + esc(t.slice(s, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length, e)) + (e < t.length ? "…" : "");
}
function flat(bs){ return (bs || []).map(b => b.p || (b.list || b.steps || []).join(" ") || b.code || b.tip || b.note || (b.defs ? b.defs.map(d => d.join(" ")).join(" ") : "") ||
  (b.table ? [].concat(b.table.head || [], ...(b.table.rows || [])).join(" ") : "") || (b.figure ? b.figure.caption || "" : "")).join(" "); }
function viewSearch(){
  const q = st.query.trim().toLowerCase();
  if (q.length < 2) return '<p class="empty">Type at least two characters.</p>';
  const L = [], C = [], P = [];
  U.forEach(u => {
    u.sections.forEach((s, i) => { const t = s.title + " " + flat(s.blocks); if (t.toLowerCase().includes(q)) L.push('<button class="hit" data-act="tosec2" data-unit="' + u.id + '" data-i="' + i + '"><span class="w">' + esc(u.code) + " · Lesson</span><strong>" + inl(s.title) + '</strong><span class="s">' + snippet(t, q) + "</span></button>"); });
    u.cards.forEach((c, i) => { const t = c.front + ": " + c.back; if (t.toLowerCase().includes(q)) C.push('<button class="hit" data-act="tocard" data-unit="' + u.id + '" data-i="' + i + '"><span class="w">' + esc(u.code) + ' · Flashcard</span><span class="s">' + snippet(t, q) + "</span></button>"); });
  });
  Object.keys(S.text || {}).forEach(id => (S.text[id] || []).forEach((t, i) => { if (t && t.toLowerCase().includes(q)) P.push('<button class="hit" data-act="slide" data-deck="' + id + '" data-page="' + (i + 1) + '"><span class="w">' + esc(D[id].short) + " · page " + (i + 1) + '</span><span class="s">' + snippet(t, q) + "</span></button>"); }));
  const grp = (h, a) => a.length ? "<div><h3>" + h + " (" + a.length + ')</h3><div class="sres" style="gap:6px;margin-top:8px">' + a.slice(0, 40).join("") + "</div></div>" : "";
  const all = grp("Lessons", L) + grp("Original slides and tutorials", P) + grp("Flashcards", C);
  return '<div class="sres"><div class="qmeta"><span>Results for “' + esc(st.query.trim()) + "”</span></div>" + (all || '<p class="empty">Nothing matches. Try a shorter word, such as a term from the slides.</p>') + "</div>";
}

/* ---------- shorts: the feed (and, with features.social, likes, comments and sharing) ---------- */
/* Without features.social: a plain player, no server, no accounts, no requests; with site.url set in course.json, a
   short can be shared as a link to it. With features.social: likes, a liked view, anonymous comments, share counts and
   watch stats, kept by the site's own API at site.api (specs/SOCIAL_API.md). When the API does not answer, likes and
   comments stay on this device and nothing else is sent. */
const SITE_URL = C.url ? String(C.url).replace(/\/?$/, "/") : "";
const SOCIAL = !!HAS.social;
const API = SOCIAL ? String(C.api || "/api/").replace(/\/?$/, "/") : "";
const SHARE_BASE = SOCIAL && C.shareBase ? String(C.shareBase).replace(/\/?$/, "/") : "";

const SH = HAS.shorts ? (S.shorts || []).slice() : [];
const SHM = Object.fromEntries(SH.map(s => [s.id, s]));
const ICON = {

  comment: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/></svg>',
