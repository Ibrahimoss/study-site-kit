};
function fmtCount(n){ return n >= 1000 ? (Math.round(n / 100) / 10) + "K" : String(n); }
function ago(ms){ const s = Math.max(1, Math.round((Date.now() - ms) / 1000)); if (s < 60) return s + "s"; const m = Math.round(s / 60); if (m < 60) return m + "m"; const h = Math.round(m / 60); if (h < 48) return h + "h"; return Math.round(h / 24) + "d"; }

/* --- what this device has watched (and, with social on, liked), kept in local storage --- */
const Mine = {
  KEY: LS + "shorts", data: null,
  load(){
    if (this.data) return this.data;
    let d = null; try { d = JSON.parse(localStorage.getItem(this.KEY) || "null"); } catch(e) {}
    d = d && typeof d === "object" ? d : {};
    d.seen = d.seen && typeof d.seen === "object" ? d.seen : {}; d.liked = d.liked && typeof d.liked === "object" ? d.liked : {};
    return (this.data = d);
  },
  save(){ try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e) {} },
  markSeen(id){ this.load().seen[id] = Date.now(); this.save(); },
  liked(id){ return !!this.load().liked[id]; },
  setLiked(id, on){ const d = this.load(); if (on) d.liked[id] = d.liked[id] || Date.now(); else delete d.liked[id]; this.save(); },
  likedIds(){ const l = this.load().liked; return Object.keys(l).filter(id => SHM[id]).sort((a, b) => l[b] - l[a]); }
};

/* --- anonymous watch stats, sent to the site's API only (social on and the API answering): how far each view of a
   short got. Nothing that identifies the device goes with them. --- */
const Views = {
  q: [], cur: null,
  begin(id, v){ this.end(); if (!SOCIAL) return; this.cur = { id, v, max: 0, secs: 0, last: null, looped: false }; },
  tick(v){
    const c = this.cur; if (!c || c.v !== v || !v.duration) return;
    const t = v.currentTime;
    if (c.last !== null) {
      const d = t - c.last;
      if (d > 0 && d < 1.5) c.secs += d;
      else if (d < -1 && c.last > v.duration - 1.5) c.looped = true;      // the video looped: watched to the end
    }
    c.last = t; c.max = Math.max(c.max, t / v.duration);
  },
  end(){
    const c = this.cur; this.cur = null;
    if (!c || Social.mode !== "server") return;
    this.q.push({ short: c.id, pct: c.looped ? 100 : Math.round(100 * Math.min(1, c.max)), secs: Math.round(c.secs * 10) / 10 });
    if (this.q.length >= 10) this.flush();
  },
  flush(){
    if (!this.q.length || Social.mode !== "server") return;
    const body = JSON.stringify({ views: this.q.splice(0, 20) });
    try { if (navigator.sendBeacon && navigator.sendBeacon(API + "views", new Blob([body], { type: "application/json" }))) return; } catch(e) {}
    fetch(API + "views", { method: "POST", body, keepalive: true, headers: { "Content-Type": "application/json" } }).catch(() => {});
  }
};
if (SOCIAL) {
  setInterval(() => Views.flush(), 30000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { Views.end(); Views.flush(); }
    else if (Shorts.mounted && Shorts.cur) Views.begin(Shorts.cur, Shorts.curVideo());
  });
  window.addEventListener("pagehide", () => { Views.end(); Views.flush(); });
}

/* the feed order: a new shuffle on every visit. Shorts this device has not watched come first; watched ones come
   back only after all the others (longest ago first). Neighbours avoid the same chapter and narrator when they can. */
function shuffled(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function spread(list, prev){
  const out = [], pool = list.slice();
  while (pool.length) {
    const last = out.length ? out[out.length - 1] : prev;
    let i = last ? pool.findIndex(s => s.unit !== last.unit && s.look !== last.look) : 0;
    if (i < 0) i = pool.findIndex(s => s.unit !== last.unit);
    out.push(pool.splice(Math.max(0, i), 1)[0]);
  }
  return out;
}
function feedOrder(startId){
  const seen = Mine.load().seen;
  const fresh = spread(shuffled(SH.filter(s => !seen[s.id])));
  const old = SH.filter(s => seen[s.id]).sort((a, b) => seen[a.id] - seen[b.id]);
  const loose = []; for (let i = 0; i < old.length; i += 4) loose.push(...shuffled(old.slice(i, i + 4)));
  let out = fresh.concat(spread(loose, fresh[fresh.length - 1]));
  if (startId && SHM[startId]) out = [SHM[startId]].concat(out.filter(s => s.id !== startId));   // a shared link opens its short first
  return out;
}

/* --- social backends (features.social only): the site's API (site.api), or this device when the API does not answer --- */
const Social = {
  mode: "off", canWrite: false, canComment: false, admin: false, me: null, myName: "",
  likes: {}, shares: {}, comments: {}, myLikes: new Set(), listeners: [], note: "",
  on(fn){ this.listeners.push(fn); }, emit(){ this.listeners.forEach(f => { try { f(); } catch(e) {} }); },
  likeCount(id){ return this.likes[id] || 0; }, commentCount(id){ return (this.comments[id] || []).length; },
  async init(){
    if (!SOCIAL) return;
    if (this._init) return this._init;
    this.mode = "loading";
    this._init = (async () => {
      if (await this.probeServer()) { await this.initServer(); return; }
      this.initLocal();
    })().catch(() => this.initLocal());
    return this._init;
  },
  /* server: the site's API (specs/SOCIAL_API.md); every request carries this browser's random id */
  cid(){ let c = null; try { c = localStorage.getItem(LS + "anon-id"); } catch(e) {} if (!c) { c = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); try { localStorage.setItem(LS + "anon-id", c); } catch(e) {} } return c; },
  async probeServer(){
    try { const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch(API + "health", { signal: ctl.signal, cache: "no-store" }); clearTimeout(tm);
      return r.ok && (await r.json()).ok === true; } catch(e) { return false; }
  },
  adminToken(){ try { return localStorage.getItem(LS + "admin") || ""; } catch(e) { return ""; } },
  async api(path, opts){
    const headers = { "Content-Type": "application/json", "X-Client-Id": this.me };
    const tok = this.adminToken(); if (tok) headers["X-Admin-Token"] = tok;
    const r = await fetch(API + path, Object.assign({ cache: "no-store", headers }, opts || {}));
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { j.ok = false; if (!j.reason) j.reason = "The server could not save that. Try again."; }
    j.status = r.status; return j;
  },
  async initServer(){
    this.mode = "server"; this.me = this.cid(); this.canWrite = true; this.canComment = true;
    this.myLikes = new Set(Mine.likedIds());                    // hearts show at once from this device's memory
    const pull = async () => { const j = await this.api("social"); if (j.likes) { this.likes = j.likes; this.shares = j.shares || {}; this.myLikes = new Set(j.myLikes || []); this.comments = j.comments || {}; this.admin = !!j.admin; this.myName = j.me || ""; this.emit(); } };
    await pull().catch(() => {});
    Mine.likedIds().filter(id => !this.myLikes.has(id)).forEach(id => {      // liked here while the server was away
      this.myLikes.add(id); this.api("like", { method: "POST", body: JSON.stringify({ short: id, on: true }) }).catch(() => {});
    });
    this.myLikes.forEach(id => { if (!Mine.liked(id)) Mine.setLiked(id, true); });
    this.emit();
    this._poll = setInterval(() => { if (st.view === "shorts") pull().catch(() => {}); }, 20000);
  },
  /* local: this device only (the API did not answer, or the page was opened without it) */
  initLocal(){
    this.mode = "local"; this.me = "me"; this.canWrite = true; this.canComment = true;
    this.note = "Likes and comments are saved on this device only.";
    const L = store.social || (store.social = { likes: [], shares: {}, comments: {} });
    this.myLikes = new Set(L.likes.concat(Mine.likedIds())); this.likes = Object.fromEntries(L.likes.map(id => [id, 1])); this.shares = Object.assign({}, L.shares);
    this.comments = {}; Object.entries(L.comments).forEach(([s, a]) => this.comments[s] = a.map(c => Object.assign({ mine: true }, c)));
    this.emit();
  },
  saveLocal(){ store.social = { likes: [...this.myLikes], shares: this.shares, comments: Object.fromEntries(Object.entries(this.comments).map(([s, a]) => [s, a.map(c => ({ id: c.id, text: c.text, at: c.at }))])) }; save(); },
  async toggleLike(id){
    if (!this.canWrite) return { ok: false, reason: "" };
    const on = !this.myLikes.has(id);
    on ? this.myLikes.add(id) : this.myLikes.delete(id); this.likes[id] = Math.max(0, (this.likes[id] || 0) + (on ? 1 : -1)); this.emit();
    try {
      if (this.mode === "server") { const j = await this.api("like", { method: "POST", body: JSON.stringify({ short: id, on }) }); if (!j.ok) throw new Error(j.reason); }
      else this.saveLocal();
      Mine.setLiked(id, on);
      return { ok: true };
    } catch(e) { on ? this.myLikes.delete(id) : this.myLikes.add(id); this.likes[id] = Math.max(0, (this.likes[id] || 0) + (on ? -1 : 1)); this.emit(); return { ok: false, reason: (e && e.message) || "Could not save your like." }; }
  },
  async countShare(id){
    this.shares[id] = (this.shares[id] || 0) + 1; this.emit();
    try {
      if (this.mode === "server") await this.api("share", { method: "POST", body: JSON.stringify({ short: id }) });
      else if (this.mode === "local") this.saveLocal();
    } catch(e) {}
  },
  async post(id, text){
    text = String(text || "").replace(/\s+/g, " ").trim();
    if (!text) return { ok: false, reason: "Write something first." };
    if (text.length > 300) return { ok: false, reason: "Keep comments under 300 characters." };
    if (!this.canComment) return { ok: false, reason: this.note };
    if (this.mode === "server") {   /* the server runs every check before it stores a comment */
      const j = await this.api("comments", { method: "POST", body: JSON.stringify({ short: id, text }) }).catch(() => ({ ok: false, reason: "No connection to the server." }));
      if (j.ok && j.comment) { (this.comments[id] = this.comments[id] || []).unshift(Object.assign({ mine: true }, j.comment)); this.emit(); }
      return j.ok ? { ok: true } : { ok: false, reason: j.reason || "Not posted." };
    }
    const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text, at: Date.now() };
    (this.comments[id] = this.comments[id] || []).unshift(Object.assign({ mine: true }, c)); this.saveLocal(); this.emit();
    return { ok: true };
  },
  async remove(id, c){
    if (this.mode === "server") {
      const j = await this.api("comments/" + encodeURIComponent(c.id), { method: "DELETE" }).catch(() => ({ ok: false }));
      if (!j.ok) { toast("Could not delete that comment."); return; }
      this.comments[id] = (this.comments[id] || []).filter(x => x.id !== c.id); this.emit();
    } else if (this.mode === "local") {
      this.comments[id] = (this.comments[id] || []).filter(x => x.id !== c.id); this.saveLocal(); this.emit();
    }
  }
};

      const u = UM[el.dataset.unit], i = +el.dataset.sec - 1, k = secKey(u, i);
      if (store.read[k]) delete store.read[k]; else store.read[k] = true;
      save();
      if (store.read[k] && i + 1 < u.sections.length && !LEGACY) go("unit", { unit: u.id, tab: "learn", sec: i + 2 });   // done: on to the next section
      else render(true);
      break;
    }
    case "secq": {
      const u = UM[st.unit], qid = el.dataset.qid, pick = +el.dataset.i;
      const q = (u.quiz || []).find(x => x.id === qid);
      if (q && store.quiz[qid] == null) {
        const correct = q.kind === "tf" || !Array.isArray(q.options) ? (q.answer === true || q.answer === "True" ? 1 : 0) : q.answer;
        store.quiz[qid] = pick === correct ? 1 : 0; st.secPick[qid] = pick; save(); render(true);
      }
      break;
    }
    case "slideto": st.deck = el.dataset.deck; st.page = +el.dataset.page; go("unit", { unit: st.unit, tab: "slides" }); break;
    case "plan": go("plan"); break;
    case "brief": go("brief"); break;
    case "listen": go("listen"); break;
    case "lplay": Listen.play(el.dataset.id); break;
    case "lseek": Listen.play(el.dataset.id, +el.dataset.t); break;
    case "lclose": Listen.close(); break;
    case "revise": go("revise"); break;
    case "jump": { const t = document.getElementById(el.dataset.jump); if (t) { t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); try { t.focus({ preventScroll: true }); } catch(e) {} } break; }
    case "shorts": go("shorts"); break;
    case "quick": st.quiz = mockQuiz(); go("quick"); break;
    case "exam": if (!st.paper) st.paper = newPaper(); go("exam"); break;
    case "pfilter": try { localStorage.setItem(LS + "pfilter", el.dataset.v); } catch(err) {} render(true); break;
    case "xmode": st.paper = el.dataset.v ? fixedPaper(el.dataset.v) : newPaper(); Object.keys(st.openSol).forEach(k => { if (k.startsWith("x:")) delete st.openSol[k]; }); render(true); break;
    case "xnew": st.paper = newPaper(); Object.keys(st.openSol).forEach(k => { if (k.startsWith("x:")) delete st.openSol[k]; }); go("exam"); break;
    case "xreveal": st.paper.qs.forEach(q => q.parts.forEach(x => st.openSol["x:" + paperItem(x).id] = true)); render(true); break;
    case "xgrade": st.paper.graded[el.dataset.id] = +el.dataset.v; store.practice[el.dataset.id] = +el.dataset.v; save(); render(true); break;
    case "pgrade": store.practice[el.dataset.id] = +el.dataset.v; save(); render(true); break;
    case "mcq": case "mcqreset": {
      const id = el.dataset.id, P = allPractice().find(x => x.p.id === id), v = el.dataset.act === "mcq" ? +el.dataset.i : null;
      if (!P) break;
      if (v == null) { delete pickStore(el.dataset.k)[el.dataset.k]; delete store.practice[id]; if (el.dataset.g === "xgrade" && st.paper) delete st.paper.graded[id]; }
      else {
        pickStore(el.dataset.k)[el.dataset.k] = v; const g = v === P.p.choice ? 1 : 0; store.practice[id] = g;
        if (el.dataset.g === "xgrade" && st.paper) st.paper.graded[id] = g;
      }
      save(); render(true); break;
    }
    case "allcards": { const items = []; U.forEach(u => u.cards.forEach((c, i) => items.push({ u: u.id, i }))); st.cards = newCards("all", items, "All units"); go("allcards"); break; }
    case "slide": openSlide(el.dataset.deck, +el.dataset.page); break;
    case "zoom": lbOpen(el.dataset.deck, +el.dataset.page); break;
    case "deck": st.deck = el.dataset.deck; st.page = 1; render(true); break;
    case "page": st.page = +el.dataset.page; render(true); break;
    case "prev": st.page--; render(true); break;
    case "next": st.page++; render(true); break;
    case "tosec": go("unit", { unit: st.unit, tab: "learn", sec: +el.dataset.i + 1 }); break;
    case "tosec2": go("unit", { unit: el.dataset.unit, tab: "learn", sec: +el.dataset.i + 1 }); break;
    case "tocard": { st.view = "unit"; if (el.dataset.unit !== st.unit) st.sec = null; st.unit = el.dataset.unit; st.tab = "cards"; const u = UM[st.unit]; st.cards = newCards("unit:" + u.id, u.cards.map((c, i) => ({ u: u.id, i })), ""); st.cards.pos = +el.dataset.i; st.quiz = null; render(); window.scrollTo(0, 0); break; }
    case "toc": { const t = document.getElementById(el.dataset.id); if (t) t.scrollIntoView({ behavior: "smooth" }); break; }
    case "sol": st.openSol[el.dataset.k] = !st.openSol[el.dataset.k]; render(true); break;
    case "solall": { const on = el.dataset.v === "1"; UM[st.unit].tutorial.forEach((t, i) => st.openSol[st.unit + ":" + i] = on); (UM[st.unit].practice || []).forEach(p => st.openSol["p:" + p.id] = on); render(true); break; }
    case "ans": answer(el.dataset.v); break;
    case "qnext": { const Q = st.quiz; if (Q.pos < Q.items.length - 1) Q.pos++; else Q.done = true; render(true); scrollQuiz(); break; }
    case "qprev": st.quiz.pos = Math.max(0, st.quiz.pos - 1); render(true); break;
    case "qretry": { const Q = st.quiz; const missed = Q.items.filter((x, p) => !isRight(UM[x.u].quiz[x.i], Q.ans[p])); st.quiz = newQuiz(Q.key, shuffle(missed), Q.title + " · missed"); render(true); scrollQuiz(); break; }
    case "qrestart": { const Q = st.quiz; st.quiz = Q && Q.key === "mock" ? mockQuiz() : unitQuiz(UM[st.unit]); render(true); scrollQuiz(); break; }
    case "cflip": st.cards.flip = !st.cards.flip; render(true); break;
    case "cnext": st.cards.pos = Math.min(st.cards.items.length - 1, st.cards.pos + 1); st.cards.flip = false; render(true); break;
    case "cprev": st.cards.pos = Math.max(0, st.cards.pos - 1); st.cards.flip = false; render(true); break;
    case "crate": rateCard(+el.dataset.v); break;
    case "cfilter": st.cards.filter = el.dataset.v; applyCardFilter(st.cards); render(true); break;
    case "cshuffle": st.cards.shuffled = !st.cards.shuffled; applyCardFilter(st.cards); render(true); break;
    case "lbprev": lb.dataset.page = Math.max(first(D[lb.dataset.deck]), +lb.dataset.page - 1); lbDraw(); break;
    case "lbnext": lb.dataset.page = Math.min(D[lb.dataset.deck].pages, +lb.dataset.page + 1); lbDraw(); break;
    case "lbclose": if (e.target === el || el.tagName === "BUTTON") lbClose(); break;
  }
});
function scrollQuiz(){ const q = $(".quiz"); if (q && q.getBoundingClientRect().top < 0) q.scrollIntoView(); }
function rateCard(v){
  const C = st.cards; if (!C || !C.items.length) return;
  store.cards[cardKey(C.items[C.pos])] = v; save();
  if (C.pos < C.items.length - 1) { C.pos++; C.flip = false; }
  render(true);
}
let tx = null, ty = null;
document.addEventListener("touchstart", e => { const s = e.target.closest(".stage, .lb .img"); if (!s || e.touches.length !== 1) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (!lb.hidden) { const n = +lb.dataset.page + (dx < 0 ? 1 : -1); if (n >= first(D[lb.dataset.deck]) && n <= D[lb.dataset.deck].pages) { lb.dataset.page = n; lbDraw(); } return; }
  if (st.view === "unit" && st.tab === "slides") { const n = st.page + (dx < 0 ? 1 : -1); if (n >= first(D[st.deck]) && n <= D[st.deck].pages) { st.page = n; render(true); } }
}, { passive: true });
document.addEventListener("change", e => {
  if (e.target.id === "pg") { const d = D[st.deck]; st.page = Math.min(d.pages, Math.max(first(d), +e.target.value || 1)); render(true); }
  else if (e.target.id === "plh") { try { localStorage.setItem(LS + "plan-hours", e.target.value); } catch(err) {} render(true); }
  else if (e.target.id === "trsel") { try { localStorage.setItem(LS + "budget", e.target.value); } catch(err) {} render(true); }
});
let qt;
$("#q").addEventListener("input", e => {
  clearTimeout(qt);
  qt = setTimeout(() => {
    st.query = e.target.value;
    if (st.query.trim()) { st.view = "search"; render(); }
    else if (st.view === "search") go(st.unit ? "unit" : "home");
  }, 160);
});
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!lb.hidden) {
    if (e.key === "Escape") lbClose();
    else if (e.key === "ArrowLeft" && +lb.dataset.page > first(D[lb.dataset.deck])) { lb.dataset.page--; lbDraw(); }
    else if (e.key === "ArrowRight" && +lb.dataset.page < D[lb.dataset.deck].pages) { lb.dataset.page++; lbDraw(); }
    return;
  }
  if (st.view === "shorts") { if (Shorts.key(e)) e.preventDefault(); return; }
  const inQuiz = (st.view === "quick") || (st.view === "unit" && st.tab === "quiz");
  const inCards = (st.view === "allcards") || (st.view === "unit" && st.tab === "cards");
  if (st.view === "unit" && st.tab === "slides") {
    const d = D[st.deck];
    if (e.key === "ArrowLeft" && st.page > first(d)) { st.page--; render(true); e.preventDefault(); }
    else if (e.key === "ArrowRight" && st.page < d.pages) { st.page++; render(true); e.preventDefault(); }
  } else if (inQuiz && st.quiz && !st.quiz.done) {
    const Q = st.quiz, it = Q.items[Q.pos]; if (!it) return;
    const q = UM[it.u].quiz[it.i];
    if (q.kind === "tf") { if (/^[tT]$/.test(e.key)) answer(true); else if (/^[fF]$/.test(e.key)) answer(false); }
    else { const n = "1234567".indexOf(e.key); const l = "abcdefg".indexOf(e.key.toLowerCase()); const k = n >= 0 ? n : l; if (k >= 0 && k < it.perm.length) answer(it.perm[k]); }
    if (e.key === "Enter" && Q.ans[Q.pos] !== undefined) { if (Q.pos < Q.items.length - 1) Q.pos++; else Q.done = true; render(true); scrollQuiz(); }
  } else if (inCards && st.cards && st.cards.items.length) {
    const C = st.cards;
    if (e.key === " ") { C.flip = !C.flip; render(true); e.preventDefault(); }
    else if (e.key === "ArrowRight" && C.pos < C.items.length - 1) { C.pos++; C.flip = false; render(true); }
    else if (e.key === "ArrowLeft" && C.pos > 0) { C.pos--; C.flip = false; render(true); }
    else if (e.key === "1") rateCard(0);
    else if (e.key === "2") rateCard(1);
  }
});

/* deep link: #<unit>.quiz, #<unit>.s3 (a Learn section), #mock, #allcards, #plan, #brief, #revise; pages a course
   switched off (course.json features, a missing brief.json or revise.json) fall back to the home page */
const VIEW_NEED = Object.assign(Object.create(null), { plan: "studyPlan", brief: "brief", revise: "revise", listen: "audio" });
function fromHash(){
  let h = ""; try { h = decodeURIComponent((location.hash || "").slice(1)); } catch(e) {}
  const [uid, tab] = h.split(".");
  if (UM[uid]) {
    if (uid !== st.unit) { st.quiz = null; st.cards = null; st.deck = null; st.page = 1; }
    st.view = "unit"; st.unit = uid;
    const sm = /^s(\d+)$/.exec(tab || "");
    if (sm) { st.tab = "learn"; st.sec = +sm[1] > 0 ? +sm[1] : null; }
    else { st.tab = tab === "tutorial" ? "practice" : TABS.some(t => t[0] === tab) ? tab : "learn"; st.sec = null; }
    ensureTabState();
  }
  else if (VIEW_NEED[h] !== undefined) st.view = HAS[VIEW_NEED[h]] ? h : "home";
  else if (/^cram\./.test(h) && UM[h.slice(5)] && SH.length) { Shorts.openPlaylist(Object.assign(Shorts.cram(h.slice(5)), { back: { view: "unit", unit: h.slice(5), tab: "learn" } })); return; }
  else if ((h === "shorts" || /^short\./.test(h)) && HAS.shorts) { st.view = "shorts"; st.shortStart = h.startsWith("short.") ? h.slice(6) : null; }
  else if (h === "quick") { st.quiz = mockQuiz(); st.view = "quick"; }
  else if ((h === "exam" || h === "mock") && HAS.mockExam) { st.paper = st.paper || newPaper(); st.view = "exam"; }
  else if (h === "allcards") { const items = []; U.forEach(u => u.cards.forEach((c, i) => items.push({ u: u.id, i }))); st.cards = newCards("all", items, "All units"); st.view = "allcards"; }
  else if (!h) st.view = "home";
  else if (/^s-/.test(h)) return;
  render(); window.scrollTo(0, 0); scrollToSec();
}
window.addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
